<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claire & Claude</title>
    <link rel="stylesheet" href="css/style.css?t=2002">
</head>
<body>
    <div id="app-container">
        <!-- 顶部标题栏 -->
        <div class="top-bar">
            <div class="menu-btn">≡</div>
            <div class="title" id="top-title">Claire & Claude</div>
            <div class="heart">❤️ 100%</div>
        </div>

        <!-- 页面区域 (横向滑动) -->
        <div class="page-container" id="scroll-box">
            
            <!-- 0. Home 首页 -->
            <div id="page-home" class="page">
                <div class="card" style="text-align: center; padding: 30px 15px;">
                    <h3 style="color: #6b8bbd;">Little love record</h3>
                    <h1 style="font-size: 48px; color: #4a70a8; margin: 10px 0;">44</h1>
                    <p style="color: #999;">days together for</p>
                </div>
            </div>

            <!-- 1. Memory 回忆页 -->
            <div id="page-memory" class="page">
                <div style="padding: 0 5px; margin-bottom: 10px; color: #4a70a8; font-weight: bold; display: flex; justify-content: space-between;">
                    <span>我们的回忆</span>
                    <span style="font-size: 12px; color: #999; font-weight: normal;">把日子慢慢装满</span>
                </div>
                <div id="desktop" class="memory-grid"></div>
            </div>

            <!-- 2. Chat 聊天页 -->
            <div id="page-chat" class="page" style="position: relative; padding-bottom: 0;">
                <div id="app-content-list" style="flex: 1; overflow-y: auto; padding-bottom: 80px;"></div>
                
                <!-- 聊天底部输入框 -->
                <div class="chat-input-bar">
                    <div class="icon-btn">⊕</div>
                    <input type="text" id="chat-input" placeholder="宝宝，说话...">
                    <div class="icon-btn" style="font-size: 20px;">🙂</div>
                    <div class="icon-btn send-btn" onclick="window.PhoneEngine.sendChatMessage()">➤</div>
                </div>
            </div>

            <!-- 3. Together 音乐/共同页 -->
            <div id="page-together" class="page">
                <div class="card" style="text-align: center;">
                    <h3 style="color: #6b8bbd;">Together</h3>
                    <p style="color: #999; margin-top: 10px;">功能开发中...</p>
                </div>
            </div>

            <!-- 4. Mine 我的页 (增加了人设设定) -->
            <div id="page-mine" class="page">
                
                <!-- 新增：专属角色设定 -->
                <div class="card">
                    <h3 style="color: #6b8bbd; margin-bottom: 15px;">📝 专属角色设定</h3>
                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 12px; color: #666;">TA 的名字</label>
                        <input type="text" id="char-name" placeholder="例如: 小克" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-top: 4px;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="font-size: 12px; color: #666;">TA 的人设与性格 (Prompt)</label>
                        <textarea id="char-persona" rows="4" placeholder="例如: 你是我的男朋友，性格温柔，占有欲强，喜欢叫我宝宝，说话简短自然..." style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-top: 4px; resize: none;"></textarea>
                    </div>
                    <button class="btn-refresh" onclick="window.PhoneAPI.saveSettings()" style="margin-top: 0;">💾 保存设定</button>
                </div>

                <!-- API 设置 -->
                <div class="card">
                    <h3 style="color: #6b8bbd; margin-bottom: 15px;">⚙️ AI 引擎设置</h3>
                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 12px; color: #666;">接口地址 (Base URL)</label>
                        <input type="text" id="api-url" placeholder="例如: https://api.openai.com/v1" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-top: 4px;">
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 12px; color: #666;">API Key (密钥)</label>
                        <input type="password" id="api-key" placeholder="sk-..." style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-top: 4px;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="font-size: 12px; color: #666;">模型名称 (Model)</label>
                        <input type="text" id="api-model" placeholder="例如: gpt-4o 或 claude-3-opus" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-top: 4px;">
                    </div>
                    <button class="btn-refresh" onclick="window.PhoneAPI.saveSettings()" style="margin-top: 0;">💾 保存设置</button>
                </div>
            </div>
            
        </div>

        <!-- 底部导航栏 -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab(0)">
                <div class="icon">🏠</div><div class="text">Home</div>
            </div>
            <div class="nav-item" onclick="switchTab(1)">
                <div class="icon">🖼️</div><div class="text">Memory</div>
            </div>
            <div class="nav-item center-btn" onclick="switchTab(2)">
                <div class="center-circle">
                    <div class="icon" style="color: white;">💬</div>
                    <div class="text" style="color: white; margin-top: 2px;">Chat</div>
                </div>
            </div>
            <div class="nav-item" onclick="switchTab(3)">
                <div class="icon">🎵</div><div class="text">Together</div>
            </div>
            <div class="nav-item" onclick="switchTab(4)">
                <div class="icon">🌙</div><div class="text">Mine</div>
            </div>
        </div>

        <!-- Loading 遮罩 -->
        <div id="loading">生成中，请稍候...</div>
    </div>

    <script>
        const scrollBox = document.getElementById('scroll-box');
        const navItems = document.querySelectorAll('.nav-item');
        const pages = document.querySelectorAll('.page');

        function switchTab(index) {
            scrollBox.scrollTo({ left: pages[index].offsetLeft, behavior: 'smooth' });
            
            if(index === 1 && window.PhoneUI) window.PhoneUI.renderDesktop();
            if(index === 2 && window.PhoneUI) {
                window.Config.currentAppId = 'wechat'; 
                window.PhoneUI.renderAppContent('wechat');
            }
            if(index === 4 && window.PhoneAPI) window.PhoneAPI.loadSettings();
        }

        scrollBox.addEventListener('scroll', () => {
            let currentIndex = Math.round(scrollBox.scrollLeft / scrollBox.clientWidth);
            navItems.forEach((nav, i) => {
                if (i === currentIndex) {
                    nav.classList.add('active');
                } else {
                    nav.classList.remove('active');
                }
            });
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化加载设置
            setTimeout(() => {
                if(window.PhoneAPI) window.PhoneAPI.loadSettings();
                if(window.PhoneUI) window.PhoneUI.renderAppContent('wechat');
            }, 500);
        });
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
