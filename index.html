<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#dbe9f6">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <link rel="manifest" href="manifest.json">
    
    <title>Claire & Claude</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="css/style.css?t=3700">
</head>
<body>
    <div id="app-container">
        <div id="toast"><i class="ph-fill ph-check-circle" style="color: #4ade80; font-size: 18px;"></i> <span id="toast-msg">保存成功</span></div>

        <div class="top-bar">
            <div class="menu-btn" onclick="window.PhoneUI.toggleTheme()"><i class="ph-fill ph-moon" id="theme-icon" style="font-size: 18px;"></i></div>
            <div class="title" id="top-title">Claire & Claude</div>
            <div class="heart"><i class="ph-fill ph-heart"></i> 100%</div>
        </div>

        <div class="page-container" id="scroll-box">
            
            <div id="page-home" class="page">
                <div class="card" style="text-align: center; padding: 30px 15px;">
                    <h3 style="color: var(--primary-color);">Little love record</h3>
                    <h1 style="font-size: 48px; color: var(--secondary-color); margin: 10px 0;">44</h1>
                    <p style="color: var(--text-sub);">days together for</p>
                </div>
                
                <h3 style="margin: 10px 0 10px 5px; color: var(--primary-color); font-size: 14px;">我的生活</h3>
                <div class="app-grid">
                    <div class="app-icon" onclick="window.PhoneUI.openApp('novel', '线下故事')">
                        <div class="icon" id="home-icon-novel"><i class="ph-fill ph-book-open" style="color: var(--text-sub);"></i></div>
                        <div class="name" style="font-weight: bold;">线下故事</div>
                    </div>
                    <div class="app-icon" onclick="window.PhoneUI.openApp('worldbook', '世界书')">
                        <div class="icon" id="home-icon-worldbook"><i class="ph-fill ph-globe-hemisphere-west" style="color: var(--primary-color);"></i></div>
                        <div class="name" style="font-weight: bold;">世界书</div>
                    </div>
                    <div class="app-icon" onclick="window.PhoneUI.openApp('settings', '系统设置')">
                        <div class="icon" id="home-icon-settings"><i class="ph-fill ph-gear" style="color: var(--primary-color);"></i></div>
                        <div class="name" style="font-weight: bold;">系统设置</div>
                    </div>
                    <div class="app-icon" onclick="alert('相册功能开发中，敬请期待！')">
                        <div class="icon" id="home-icon-gallery"><i class="ph-fill ph-images" style="color: #e5989b;"></i></div>
                        <div class="name">相册</div>
                    </div>
                    <div class="app-icon" onclick="window.PhoneUI.openApp('shop', '商店')">
                        <div class="icon" id="home-icon-shop"><i class="ph-fill ph-storefront" style="color: #f4a261;"></i></div>
                        <div class="name">商店</div>
                    </div>
                    <div class="app-icon" onclick="window.PhoneUI.openApp('task', '打工赚钱')">
                        <div class="icon" id="home-icon-task"><i class="ph-fill ph-check-square-offset" style="color: #2a9d8f;"></i></div>
                        <div class="name">打工赚钱</div>
                    </div>
                </div>
            </div>

            <!-- 🌟 核心升级：Memory 变身星海档案馆 -->
            <div id="page-memory" class="page" style="padding: 0;">
                <div class="starry-sea-bg" id="starry-sea-bg">
                    <!-- 星星由 JS 动态生成 -->
                </div>
                
                <div class="floating-bubbles" id="floating-bubbles">
                    <div class="glass-bubble bubble-diary" onclick="window.PhoneUI.openApp('diary', '他的日记')">
                        <i class="ph-fill ph-book-bookmark icon"></i>
                        <span class="text">日记</span>
                    </div>
                    <div class="glass-bubble bubble-vault" onclick="window.PhoneUI.openApp('memory_vault', '全局记忆库')">
                        <i class="ph-fill ph-database icon"></i>
                        <span class="text">记忆库</span>
                    </div>
                    <div class="glass-bubble bubble-gallery" onclick="alert('相册功能开发中！')">
                        <i class="ph-fill ph-polaroid-camera icon"></i>
                        <span class="text">相册</span>
                    </div>
                </div>

                <!-- 记忆碎片由 JS 动态生成并挂载在这里 -->
                <div id="memory-fragments-container"></div>
            </div>

            <div id="page-chat" class="page" style="position: relative; padding-bottom: 0;">
                <div id="app-content-list" style="flex: 1; overflow-y: auto; padding-bottom: 140px;"></div>
                
                <div id="chat-plus-menu" class="chat-plus-menu" style="grid-template-columns: repeat(3, 1fr);">
                    <div class="app-icon" onclick="window.PhoneUI.openApp('skill', '技能架'); window.PhoneUI.toggleChatMenu();">
                        <div class="icon"><i class="ph-fill ph-magic-wand" style="color: #9d4edd;"></i></div>
                        <div class="name">技能架</div>
                    </div>
                    <div class="app-icon" onclick="window.PhoneUI.openApp('roulette', '话题转盘'); window.PhoneUI.toggleChatMenu();">
                        <div class="icon"><i class="ph-fill ph-aperture" style="color: #ffb703;"></i></div>
                        <div class="name">转盘</div>
                    </div>
                    <div class="app-icon" onclick="window.PhoneUI.openApp('wallet', '钱包'); window.PhoneUI.toggleChatMenu();">
                        <div class="icon"><i class="ph-fill ph-wallet" style="color: var(--secondary-color);"></i></div>
                        <div class="name">钱包</div>
                    </div>
                </div>

                <form class="chat-input-bar" onsubmit="event.preventDefault(); window.PhoneEngine.sendUserMsgOnly(); window.PhoneUI.closeChatMenu();">
                    <div class="icon-btn" onclick="window.PhoneUI.toggleChatMenu()" id="btn-plus"><i class="ph ph-plus-circle"></i></div>
                    <input type="text" id="chat-input" enterkeyhint="send" placeholder="宝宝，说话..." onclick="window.PhoneUI.closeChatMenu()">
                    <div class="icon-btn" style="font-size: 22px;"><i class="ph ph-smiley"></i></div>
                    <div class="icon-btn send-btn" onclick="window.PhoneEngine.sendChatMessage(); window.PhoneUI.closeChatMenu();"><i class="ph-fill ph-paper-plane-right"></i></div>
                </form>
            </div>

            <div id="page-together" class="page">
                <div class="card" style="text-align: center;">
                    <h3 style="color: var(--primary-color);">Together</h3>
                    <p style="color: var(--text-sub); margin-top: 10px;">功能开发中...</p>
                </div>
            </div>

            <div id="page-mine" class="page">
                <div class="card" style="text-align: center; padding: 50px 20px; color: var(--text-sub);">
                    <i class="ph-fill ph-user-circle" style="font-size: 48px; color: var(--bg-gradient-start); margin-bottom: 10px;"></i>
                    <h3 style="color: var(--primary-color); margin-bottom: 10px;">个人中心</h3>
                    <p style="font-size: 13px;">好感度、成就徽章、角色衣柜等功能开发中...<br><br>（硬核设置已转移至首页的「系统设置」App）</p>
                </div>
            </div>
            
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab(0)">
                <div class="icon"><i class="ph ph-house"></i></div><div class="text">Home</div>
            </div>
            <div class="nav-item" onclick="switchTab(1)">
                <div class="icon"><i class="ph ph-images"></i></div><div class="text">Memory</div>
            </div>
            <div class="nav-item center-btn" onclick="switchTab(2)">
                <div class="center-circle">
                    <div class="icon"><i class="ph-fill ph-chat-circle-dots"></i></div>
                    <div class="text" style="color: white; margin-top: 2px;">Chat</div>
                </div>
            </div>
            <div class="nav-item" onclick="switchTab(3)">
                <div class="icon"><i class="ph ph-music-notes"></i></div><div class="text">Together</div>
            </div>
            <div class="nav-item" onclick="switchTab(4)">
                <div class="icon"><i class="ph ph-moon"></i></div><div class="text">Mine</div>
            </div>
        </div>

        <div id="action-bg" class="action-sheet-bg" onclick="window.PhoneEngine.closeMsgMenu()"></div>
        <div id="action-sheet" class="action-sheet">
            <button class="action-btn" onclick="window.PhoneEngine.editMsg()"><i class="ph ph-pencil-simple"></i> 编辑此消息</button>
            <button class="action-btn" id="btn-regen" onclick="window.PhoneEngine.regenMsg()"><i class="ph ph-arrows-clockwise"></i> 重新生成 (删除此条并重骰)</button>
            <button class="action-btn danger" onclick="window.PhoneEngine.deleteMsg()"><i class="ph ph-trash"></i> 删除此消息</button>
            <button class="action-btn cancel" onclick="window.PhoneEngine.closeMsgMenu()">取消</button>
        </div>

        <div id="thought-bg" class="action-sheet-bg" onclick="window.PhoneUI.closeThought()"></div>
        <div id="thought-modal" class="thought-modal">
            <div class="thought-header"><i class="ph-fill ph-cloud"></i> TA 的心声</div>
            <div class="thought-content" id="thought-content"></div>
        </div>

        <div id="wb-modal-bg" class="action-sheet-bg" onclick="window.PhoneUI.closeWbModal()"></div>
        <div id="wb-modal" class="thought-modal" style="padding: 20px;">
            <div class="thought-header"><i class="ph-fill ph-plus-circle"></i> 编写新规则</div>
            <input type="text" id="wb-new-title" placeholder="规则名称 (如: 防八股)" style="width: 100%; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; outline: none;">
            <textarea id="wb-new-content" placeholder="输入具体的规则内容，越详细越好..." style="width: 100%; padding: 12px; border-radius: 8px; min-height: 100px; resize: none; font-size: 13px; line-height: 1.5; outline: none; margin-bottom: 15px; font-family: inherit;"></textarea>
            <button class="btn-refresh" onclick="window.PhoneAPI.addWorldbook()" style="margin-top: 0;">保存并挂载</button>
        </div>

        <div id="archive-modal-bg" class="action-sheet-bg" onclick="window.PhoneUI.closeArchiveModal()"></div>
        <div id="archive-modal" class="thought-modal" style="padding: 20px; max-height: 80vh;">
            <div class="thought-header"><i class="ph-fill ph-floppy-disk"></i> 剧情存档室 (平行宇宙)</div>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="archive-name" placeholder="给当前剧情起个名字..." style="flex: 1; padding: 10px; border-radius: 8px; outline: none;">
                <button class="btn-refresh" onclick="window.PhoneAPI.saveArchive()" style="margin-top: 0; width: auto; padding: 0 15px;">存档</button>
            </div>
            <button class="btn-refresh" onclick="window.PhoneAPI.startNewTimeline()" style="margin-top: 0; margin-bottom: 15px; background: transparent; color: var(--danger-color); border: 1px dashed var(--danger-color);"><i class="ph ph-magic-wand"></i> 开启全新时间线 (清空当前)</button>
            <div id="archive-list" style="overflow-y: auto; max-height: 40vh; display: flex; flex-direction: column; gap: 10px;"></div>
        </div>

        <!-- 🌟 盲盒弹窗 -->
        <div id="blindbox-bg" class="action-sheet-bg" onclick="window.PhoneUI.closeBlindBox()"></div>
        <div id="blindbox-modal" class="blindbox-modal">
            <i class="ph-fill ph-shooting-star blindbox-icon"></i>
            <div class="blindbox-text" id="blindbox-text">“回忆碎片加载中...”</div>
            <div class="blindbox-meta" id="blindbox-meta">2023-10-24 · 线上微信</div>
        </div>

        <div id="app-window" class="app-window">
            <div class="app-window-header">
                <div class="app-window-back" onclick="window.PhoneUI.closeApp()"><i class="ph ph-caret-left"></i></div>
                <div class="app-window-title" id="app-window-title">应用名称</div>
            </div>
            <div class="app-window-content" id="app-window-content"></div>
            <div id="app-window-footer"></div>
        </div>

    </div>

    <script>
        const scrollBox = document.getElementById('scroll-box');
        const navItems = document.querySelectorAll('.nav-item');
        const pages = document.querySelectorAll('.page');

        function switchTab(index) {
            scrollBox.scrollTo({ left: pages[index].offsetLeft, behavior: 'smooth' });
            if(index === 2 && window.PhoneUI) {
                window.Config.currentAppId = 'wechat'; 
                window.PhoneUI.renderAppContent('wechat');
            }
            // 🌟 核心：滑到 Memory 页时，触发星海动画！
            if(index === 1 && window.PhoneUI) {
                window.PhoneUI.initStarrySea();
            }
        }

        scrollBox.addEventListener('scroll', () => {
            let currentIndex = Math.round(scrollBox.scrollLeft / scrollBox.clientWidth);
            navItems.forEach((nav, i) => {
                if (i === currentIndex) {
                    nav.classList.add('active');
                } else {
                    nav.classList.remove('active');
                }
            });
            if(window.PhoneUI && window.PhoneUI.closeChatMenu) {
                window.PhoneUI.closeChatMenu();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                const themeIcon = document.getElementById('theme-icon');
                if (themeIcon) {
                    themeIcon.classList.remove('ph-moon');
                    themeIcon.classList.add('ph-sun');
                }
            }

            setTimeout(() => {
                if(window.PhoneAPI) {
                    window.PhoneAPI.refreshPresetDropdowns(); 
                    window.PhoneAPI.refreshPromptDropdowns();
                    window.PhoneAPI.refreshUIDropdowns();
                    window.PhoneAPI.loadSettings();
                }
                if(window.PhoneUI) window.PhoneUI.renderAppContent('wechat');
            }, 500);
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker 注册成功！'))
                .catch(err => console.error('Service Worker 注册失败:', err));
        }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
