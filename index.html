<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claire & Claude</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="css/style.css?t=2025">
</head>
<body>
    <div id="app-container">
        <div id="toast"><i class="ph-fill ph-check-circle" style="color: #4ade80; font-size: 18px;"></i> <span id="toast-msg">保存成功</span></div>

        <div class="top-bar">
            <div class="menu-btn"><i class="ph ph-list" style="font-size: 18px;"></i></div>
            <div class="title" id="top-title">Claire & Claude</div>
            <div class="heart"><i class="ph-fill ph-heart"></i> 100%</div>
        </div>

        <div class="page-container" id="scroll-box">
            
            <div id="page-home" class="page">
                <div class="card" style="text-align: center; padding: 30px 15px;">
                    <h3 style="color: #6b8bbd;">Little love record</h3>
                    <h1 style="font-size: 48px; color: #4a70a8; margin: 10px 0;">44</h1>
                    <p style="color: #999;">days together for</p>
                </div>
            </div>

            <div id="page-memory" class="page">
                <div style="padding: 0 5px; margin-bottom: 10px; color: #4a70a8; font-weight: bold; display: flex; justify-content: space-between;">
                    <span>我们的回忆</span>
                    <span style="font-size: 12px; color: #999; font-weight: normal;">把日子慢慢装满</span>
                </div>
                <div id="desktop" class="memory-grid"></div>
            </div>

            <div id="page-chat" class="page" style="position: relative; padding-bottom: 0;">
                <div id="app-content-list" style="flex: 1; overflow-y: auto; padding-bottom: 140px;"></div>
                
                <div class="chat-input-bar">
                    <div class="icon-btn"><i class="ph ph-plus-circle"></i></div>
                    <input type="text" id="chat-input" placeholder="宝宝，说话...">
                    <div class="icon-btn" style="font-size: 22px;"><i class="ph ph-smiley"></i></div>
                    <div class="icon-btn send-btn" onclick="window.PhoneEngine.sendChatMessage()"><i class="ph-fill ph-paper-plane-right"></i></div>
                </div>
            </div>

            <div id="page-together" class="page">
                <div class="card" style="text-align: center;">
                    <h3 style="color: #6b8bbd;">Together</h3>
                    <p style="color: #999; margin-top: 10px;">功能开发中...</p>
                </div>
            </div>

            <div id="page-mine" class="page">
                <div class="card">
                    <h3 style="color: #6b8bbd; margin-bottom: 15px;"><i class="ph ph-note-pencil"></i> 专属角色设定</h3>
                    
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <div style="flex: 1;">
                            <label style="font-size: 12px; color: #666;">我的名字</label>
                            <input type="text" id="my-name" placeholder="例如: 小棋" oninput="window.PhoneAPI.autoSave()" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-top: 4px;">
                        </div>
                        <div style="flex: 1;">
                            <label style="font-size: 12px; color: #666;">TA的名字</label>
                            <input type="text" id="char-name" placeholder="例如: 小克" oninput="window.PhoneAPI.autoSave()" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-top: 4px;">
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <div style="flex: 1;">
                            <label style="font-size: 12px; color: #666;">我的头像(网址)</label>
                            <input type="text" id="my-avatar" placeholder="http..." oninput="window.PhoneAPI.autoSave()" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-top: 4px;">
                        </div>
                        <div style="flex: 1;">
                            <label style="font-size: 12px; color: #666;">TA的头像(网址)</label>
                            <input type="text" id="ta-avatar" placeholder="http..." oninput="window.PhoneAPI.autoSave()" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-top: 4px;">
                        </div>
                    </div>
                    
                    <div style="margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; background: #f9f9f9; padding: 10px; border-radius: 8px;">
                        <label style="font-size: 13px; color: #333; font-weight: bold;"><i class="ph ph-prohibit"></i> 绝对禁止 AI 使用 Emoji</label>
                        <input type="checkbox" id="ban-emoji" onchange="window.PhoneAPI.autoSave()" style="width: 18px; height: 18px;">
                    </div>
                    
                    <div style="margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; background: #f9f9f9; padding: 10px; border-radius: 8px;">
                        <label style="font-size: 13px; color: #333; font-weight: bold;"><i class="ph ph-text-align-left"></i> 回复长度风格</label>
                        <select id="reply-length" onchange="window.PhoneAPI.autoSave()" style="padding: 6px; border-radius: 6px; border: 1px solid #ddd; outline: none;">
                            <option value="short">极简 (真实微信聊天)</option>
                            <option value="medium">中等 (带点动作描写)</option>
                            <option value="long">长篇 (小作文/语C)</option>
                        </select>
                    </div>
                    
                    <!-- 保留按钮，给用户心理安慰，其实后台已经自动存了 -->
                    <button class="btn-refresh" onclick="window.PhoneAPI.saveSettings()" style="margin-top: 0;"><i class="ph ph-floppy-disk"></i> 手动保存设定</button>
                </div>

                <div class="card">
                    <h3 style="color: #6b8bbd; margin-bottom: 15px;"><i class="ph ph-gear"></i> AI 引擎设置 (打字自动保存)</h3>
                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 12px; color: #666;">接口地址 (Base URL)</label>
                        <input type="text" id="api-url" placeholder="例如: https://api.openai.com/v1" oninput="window.PhoneAPI.autoSave()" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-top: 4px;">
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 12px; color: #666;">API Key (密钥)</label>
                        <input type="password" id="api-key" placeholder="sk-..." oninput="window.PhoneAPI.autoSave()" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-top: 4px;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="font-size: 12px; color: #666;">模型名称 (Model)</label>
                        <div style="display: flex; gap: 8px; margin-top: 4px;">
                            <select id="api-model-select" onchange="document.getElementById('api-model').value = this.value; window.PhoneAPI.autoSave();" style="padding: 8px; border: 1px solid #ddd; border-radius: 8px; outline: none; background: #fff;">
                                <option value="gemini-1.5-pro-latest">Gemini 1.5 Pro</option>
                                <option value="claude-3-5-sonnet-20240620">Claude 3.5 Sonnet</option>
                                <option value="gpt-4o">GPT-4o</option>
                                <option value="">自定义...</option>
                            </select>
                            <input type="text" id="api-model" placeholder="手动输入模型名" oninput="window.PhoneAPI.autoSave()" style="flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 8px;">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3 style="color: #ff4d4f; margin-bottom: 15px;"><i class="ph ph-trash"></i> 危险操作</h3>
                    <button class="btn-refresh" onclick="window.PhoneAPI.clearChat()" style="background: #ff4d4f; margin-top: 0;"><i class="ph ph-warning-circle"></i> 清空聊天记录</button>
                </div>
            </div>
            
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab(0)">
                <div class="icon"><i class="ph ph-house"></i></div><div class="text">Home</div>
            </div>
            <div class="nav-item" onclick="switchTab(1)">
                <div class="icon"><i class="ph ph-images"></i></div><div class="text">Memory</div>
            </div>
            <div class="nav-item center-btn" onclick="switchTab(2)">
                <div class="center-circle">
                    <div class="icon" style="color: white;"><i class="ph-fill ph-chat-circle-dots"></i></div>
                    <div class="text" style="color: white; margin-top: 2px;">Chat</div>
                </div>
            </div>
            <div class="nav-item" onclick="switchTab(3)">
                <div class="icon"><i class="ph ph-music-notes"></i></div><div class="text">Together</div>
            </div>
            <div class="nav-item" onclick="switchTab(4)">
                <div class="icon"><i class="ph ph-moon"></i></div><div class="text">Mine</div>
            </div>
        </div>

        <div id="action-bg" class="action-sheet-bg" onclick="window.PhoneEngine.closeMsgMenu()"></div>
        <div id="action-sheet" class="action-sheet">
            <button class="action-btn" onclick="window.PhoneEngine.editMsg()"><i class="ph ph-pencil-simple"></i> 编辑此消息</button>
            <button class="action-btn" id="btn-regen" onclick="window.PhoneEngine.regenMsg()"><i class="ph ph-arrows-clockwise"></i> 重新生成 (删除此条并重骰)</button>
            <button class="action-btn danger" onclick="window.PhoneEngine.deleteMsg()"><i class="ph ph-trash"></i> 删除此消息</button>
            <button class="action-btn cancel" onclick="window.PhoneEngine.closeMsgMenu()">取消</button>
        </div>

    </div>

    <script>
        const scrollBox = document.getElementById('scroll-box');
        const navItems = document.querySelectorAll('.nav-item');
        const pages = document.querySelectorAll('.page');

        function switchTab(index) {
            scrollBox.scrollTo({ left: pages[index].offsetLeft, behavior: 'smooth' });
            if(index === 1 && window.PhoneUI) window.PhoneUI.renderDesktop();
            if(index === 2 && window.PhoneUI) {
                window.Config.currentAppId = 'wechat'; 
                window.PhoneUI.renderAppContent('wechat');
            }
            // 🚨 核心修复：去掉了这里的 loadSettings，防止手滑切页面导致输入被覆盖！
        }

        scrollBox.addEventListener('scroll', () => {
            let currentIndex = Math.round(scrollBox.scrollLeft / scrollBox.clientWidth);
            navItems.forEach((nav, i) => {
                if (i === currentIndex) {
                    nav.classList.add('active');
                } else {
                    nav.classList.remove('active');
                }
            });
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if(window.PhoneAPI) window.PhoneAPI.loadSettings();
                if(window.PhoneUI) window.PhoneUI.renderAppContent('wechat');
            }, 500);
        });
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
