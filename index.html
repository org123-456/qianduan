<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Sky</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="phone-container">
        
        <!-- ================= 顶栏 (新增了设置小齿轮) ================= -->
        <header id="top-header">
            <div class="header-title">Memory Sky</div>
            <div class="header-actions">
                <button id="api-toggle-btn" class="icon-btn" title="切换API">🔌</button>
                <button id="theme-toggle-btn" class="icon-btn" title="切换主题">🌙</button>
                <!-- 系统设置挪到这里了 -->
                <button id="settings-toggle-btn" class="icon-btn" title="系统设置">⚙️</button>
            </div>
        </header>

        <!-- ================= 核心内容区 ================= -->
        <main id="app-main">
            
            <!-- 1. 首页 (Home) -->
            <div id="home-app" class="app-page active">
                <!-- 日常组件：日历、倒计时、纸条等 -->
                <div class="home-widgets">
                    <h2>欢迎回来</h2>
                    <div class="widget countdown-widget">距离纪念日还有 100 天</div>
                    <div class="widget note-widget">记得按时吃饭哦~</div>
                </div>
                <!-- 删除了原来占地方的系统设置按钮 -->
            </div>

            <!-- 2. 记忆 (Memory) - 已清空，专心做 3D 星海 -->
            <div id="memory-app" class="app-page hidden">
                <div class="memory-desktop">
                    <div class="photo-frame" id="memory-frame">
                        <!-- 默认相框图片 -->
                        <img src="assets/default-memory.jpg" alt="Memory" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiM0NDQiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0iI2ZmZiIgZHk9Ii4zZW0iIHRleHQtYW5jaG9yPSJtaWRkbGUiPuaYr+a1t+ebuOahhjwvdGV4dD48L3N2Zz4='">
                        <div class="frame-glass"></div>
                    </div>
                    <button class="dive-btn" id="dive-sky-btn">潜入记忆星海</button>
                </div>
                <!-- 3D星海容器，默认隐藏 -->
                <div id="memory-sky-container" class="hidden"></div>
            </div>

            <!-- 3. 聊天 (Chat) -->
            <div id="chat-app" class="app-page hidden">
                <div id="chat-messages">
                    <!-- 聊天气泡列表 -->
                </div>
                <div id="chat-input-area">
                    <textarea id="chat-input" placeholder="发消息..."></textarea>
                    <button id="send-btn">发送</button>
                </div>
            </div>

            <!-- 4. 同频 (Together) -->
            <div id="together-app" class="app-page hidden">
                <div class="together-widgets">
                    <h2>一起听歌</h2>
                    <!-- 听歌组件 -->
                </div>
            </div>

            <!-- 5. 空间 (Space) - 删除了家规，换成了日记和朋友圈双Tab -->
            <div id="space-app" class="app-page hidden">
                <!-- 空间顶部 Tab 切换 -->
                <div class="space-tabs">
                    <button class="space-tab active" onclick="switchSpaceTab('diary')">我们的日记</button>
                    <button class="space-tab" onclick="switchSpaceTab('moments')">朋友圈动态</button>
                </div>
                
                <!-- 空间内容区 -->
                <div class="space-content">
                    <!-- 日记模块 -->
                    <div id="space-diary-view" class="space-view active">
                        <div id="diary-list-container"></div>
                        <button id="write-diary-btn" class="float-btn">✏️ 写日记</button>
                    </div>
                    
                    <!-- 朋友圈模块 -->
                    <div id="space-moments-view" class="space-view hidden">
                        <div id="moments-feed"></div>
                        <button id="post-moment-btn" class="float-btn">📷 发动态</button>
                    </div>
                </div>
            </div>

        </main>

        <!-- ================= 底栏导航 (保留你原本的排版) ================= -->
        <nav id="bottom-nav">
            <button class="nav-item active" data-target="home-app">🏠<br>首页</button>
            <button class="nav-item" data-target="memory-app">✨<br>记忆</button>
            <!-- 中间的 Chat 按钮 -->
            <button class="nav-item chat-btn" data-target="chat-app">💬</button>
            <button class="nav-item" data-target="together-app">🎧<br>同频</button>
            <button class="nav-item" data-target="space-app">🪐<br>空间</button>
        </nav>

    </div>

    <!-- 核心脚本引入 -->
    <script type="module" src="js/main.js"></script>
    
    <!-- 空间双Tab切换的临时小脚本 -->
    <script>
        function switchSpaceTab(target) {
            // 切换按钮高亮
            document.querySelectorAll('.space-tab').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 切换内容显示
            document.querySelectorAll('.space-view').forEach(view => view.classList.add('hidden'));
            document.querySelectorAll('.space-view').forEach(view => view.classList.remove('active'));
            
            const targetView = document.getElementById('space-' + target + '-view');
            targetView.classList.remove('hidden');
            targetView.classList.add('active');
        }
    </script>
</body>
</html>
